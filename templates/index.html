<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfin Web Client</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-play-circle"></i>
                <h1>Jellyfin Web Client</h1>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search movies, music, shows...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <div class="connection-status" id="connectionStatus">
                    <i class="fas fa-circle"></i>
                    <span>Connecting...</span>
                </div>
                <nav class="nav-buttons">
                    <a href="/" class="nav-btn active"><i class="fas fa-home"></i> Home</a>
                    <a href="/dashboard" class="nav-btn"><i class="fas fa-dashboard"></i> My Dashboard</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="libraries-section">
                <h2>Media Libraries</h2>
                <div class="libraries-grid" id="librariesGrid">
                    <div class="loading">Loading libraries...</div>
                </div>
            </section>

            <section class="content-section" id="contentSection" style="display: none;">
                <div class="content-header">
                    <button id="backBtn" class="back-btn"><i class="fas fa-arrow-left"></i> Back</button>
                    <h2 id="contentTitle">Content</h2>
                </div>
                <div class="content-grid" id="contentGrid">
                    <!-- Content will be loaded here -->
                </div>
            </section>

            <section class="search-results" id="searchResults" style="display: none;">
                <h2>Search Results</h2>
                <div class="content-grid" id="searchGrid">
                    <!-- Search results will be loaded here -->
                </div>
            </section>

            <section class="item-details" id="itemDetails" style="display: none;">
                <div class="details-header">
                    <button id="detailsBackBtn" class="back-btn"><i class="fas fa-arrow-left"></i> Back</button>
                </div>
                <div class="details-content" id="detailsContent">
                    <!-- Item details will be loaded here -->
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Jellyfin Web Client. Powered by Flask.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
